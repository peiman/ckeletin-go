name: SLSA Provenance

on:
  release:
    types: [created]

# Default to no permissions; each job grants only what it needs
permissions: {}

jobs:
  provenance:
    name: Generate Provenance Attestations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # To upload provenance to release
      id-token: write      # For OIDC signing
      attestations: write  # To create attestations

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" -D dist/

      - name: Generate attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
