name: Fuzz Testing

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, Sunday 3am UTC
  workflow_dispatch:       # Manual trigger

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Read Task version (SSOT)
        run: |
          TASK_VERSION="$(cat .github/TASK_VERSION 2>/dev/null || true)"
          [ -n "$TASK_VERSION" ] || { echo "::error::.github/TASK_VERSION missing or empty"; exit 1; }
          echo "TASK_VERSION=${TASK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611  # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Run fuzz tests
        run: task test:fuzz FUZZTIME=60s
        timeout-minutes: 10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crashes
          path: '**/testdata/fuzz/**'
